name: opencode_chat
description: Full control client for the opencode server
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  url_launcher: ^6.2.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  # Voice: dictation + conversation mode use speech_to_text (on-device Android
  # SpeechRecognizer with partial results and a silence timeout); read aloud
  # uses flutter_tts (queued utterances + completion handlers). Both are the
  # only maintained plugins for this job on Android.
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VariableFont_wght.ttf
          style: italic
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
