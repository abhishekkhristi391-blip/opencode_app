include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by `flutter create` in CI for the Android host project only.
    - android/**
  errors:
    # These are informational; they should not break a build.
    deprecated_member_use: ignore
    unused_element_parameter: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals